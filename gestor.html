// ---- SEMÁFORO DE MATURIDADE ----
let CURVAS_MAT = null;
async function carregarCurvasMaturidade(){
  if(CURVAS_MAT!==null) return;
  CURVAS_MAT = {};
  try{
    const { data, error } = await sb.from('curvas_maturidade')
      .select('fck,estrutura,s,f28,ativo,concreteiras(nome)').eq('ativo', true);
    if(error) throw error;
    (data||[]).forEach(c=>{
      const nomeConc = c.concreteiras && c.concreteiras.nome;
      if(!nomeConc) return;
      CURVAS_MAT[c.fck+'|'+nomeConc+'|'+c.estrutura] = { s:Number(c.s), f28:Number(c.f28), r2:(c.r2!=null?Number(c.r2):null) };
    });
  }catch(e){ CURVAS_MAT = {}; }
}
function estruturaDoPav(pav){ return (String(pav||'').trim().toLowerCase()==='infraestrutura') ? 'INFRA' : 'SUPRA'; }
function curvaPara(fck, concreteira, pav){ if(!CURVAS_MAT) return null; return CURVAS_MAT[fck+'|'+concreteira+'|'+estruturaDoPav(pav)] || null; }
function projeta28(mpaJovem, idade, curva){ return mpaJovem / Math.exp(curva.s*(1 - Math.sqrt(28/idade))); }
function statusSemaforo(mpaJovem, idade, fck, concreteira, pav){
  if(mpaJovem==null || !(idade<28) || !fck) return 'neutro';
  const curva = curvaPara(fck, concreteira, pav);
  if(!curva) return 'neutro';
  const pct = projeta28(mpaJovem, idade, curva) / fck;
  if(pct >= 1.15) return 'verde';
  if(pct >= 1.00) return 'amarelo';
  return 'vermelho';
}
// chip curto para a tabela de parciais (mesma escrita da tela Resultados do lab)
function semaforoChipParcial(mpaJovem, idade, fck, concreteira, pav){
  const s = statusSemaforo(mpaJovem, idade, fck, concreteira, pav);
  if(s==='verde') return '<span class="chip s-verde">Seguindo o esperado</span>';
  if(s==='amarelo') return '<span class="chip s-amarelo">Atenção</span>';
  if(s==='vermelho') return '<span class="chip s-vermelho">Risco identificado</span>';
  return '<span class="chip info">parcial</span>'; // sem curva
}

let userEmail='';
let perfisUsuario=[];
const PERFIS_OK=['admin','gestor'];

let OBRAS=[];
let G = { aba:'dash', obra:null, fData:'', fPav:null, dados:null, calRef:null, showCal:false,
  rel:{ de:'', ate:'', traco:'', pav:'', idade:'' } };

function fmtData(iso){ if(!iso) return '—'; const s=String(iso).slice(0,10); const[a,m,d]=s.split('-'); return d&&m&&a?`${d}/${m}/${a}`:s; }
function fmt(n,c){ if(n==null||isNaN(n)) return '—'; return Number(n).toFixed(c==null?1:c); }
function ehFinal(idade){ return idade!=null && idade>=28; }
function andarDe(nomePav){ const i=nomePav.indexOf(' - '); return i>=0 ? nomePav.slice(0,i).trim() : nomePav.trim(); }

// ---- LOGIN ----
function telaLogin(msg){
  root.innerHTML = `
    <div class="login-wrap"><div class="login-box">
      <div class="login-logo">GT&amp;ABC</div>
      <div class="login-tit">Gestor</div>
      <div class="login-sub">Controle Tecnológico de Concreto</div>
      <label>E-mail</label><input id="li_email" type="email" autocapitalize="off" placeholder="seu@email.com">
      <label>Senha</label><input id="li_senha" type="password" placeholder="••••••••">
      ${msg?`<div class="erro">${msg}</div>`:''}
      <button class="btn" id="li_btn" onclick="entrar()">Entrar</button>
    </div></div>`;
}
async function entrar(){
  const email=document.getElementById('li_email').value.trim();
  const senha=document.getElementById('li_senha').value;
  if(!email||!senha){ telaLogin('Preencha e-mail e senha.'); return; }
  const btn=document.getElementById('li_btn'); btn.disabled=true; btn.textContent='Entrando…';
  const { data, error } = await sb.auth.signInWithPassword({email,password:senha});
  if(error){ telaLogin('Não consegui entrar: '+error.message); return; }
  userEmail=data.user.email; iniciar();
}
async function sair(){ await sb.auth.signOut(); userEmail=''; telaLogin(''); }
function telaSemAcesso(msg){
  root.innerHTML = `
    <div class="login-wrap"><div class="login-box" style="text-align:center">
      <div class="login-logo">GT&amp;ABC</div>
      <div class="login-tit">Sem acesso</div>
      <div class="login-sub" style="margin-bottom:14px">O usuário ${userEmail} não tem permissão para o painel do Gestor${perfisUsuario.length?` (perfil: ${perfisUsuario.join(', ')})`:''}.<br>Fale com a administradora.</div>
      ${msg?`<div class="login-sub" style="font-size:12px;color:#b02a20;margin-bottom:14px">detalhe técnico: ${msg}</div>`:''}
      <button class="btn" onclick="sair()">Sair</button>
    </div></div>`;
}

function casca(){
  return `
    <div class="topbar">
      <div class="logo">GT&amp;ABC</div>
      <div><div class="ttl">Gestor</div><div class="co">Controle Tecnológico de Concreto</div></div>
      <div class="right"><span>${userEmail}</span><button class="sair" onclick="sair()">Sair</button></div>
    </div>
    <div class="tabs">
      <button class="tab ${G.aba==='dash'?'on':''}" onclick="irAba('dash')">Dashboard</button>
      <button class="tab ${G.aba==='rel'?'on':''}" onclick="irAba('rel')">Relatórios</button>
      <button class="tab ${G.aba==='curvas'?'on':''}" onclick="irAba('curvas')">Curvas de maturidade</button>
    </div>
    <div class="wrap" id="wrap"></div>`;
}
function irAba(a){ G.aba=a; if(a==='curvas'){ carregarCurvasMaturidade().then(()=>render()); } else render(); }
function render(){
  const prevElev=document.querySelector('.elevscroll'); const elevTop=prevElev?prevElev.scrollTop:null;
  root.innerHTML = casca();
  if(G.aba==='dash') desenharDash();
  else if(G.aba==='curvas') desenharCurvas();
  else desenharRelatorios();
  const sel=document.getElementById('selObra');
  if(sel) sel.value = String(G.obra);
  if(elevTop!=null){ const e=document.querySelector('.elevscroll'); if(e) e.scrollTop=elevTop; }
}

async function iniciar(){
  root.innerHTML = '<div class="estado">Carregando…</div>';
  let err='';
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){ err='Sessão não encontrada. Saia e entre novamente.'; }
    else { const { data, error } = await sb.rpc('meus_perfis'); if(error) err=error.message; else perfisUsuario=Array.isArray(data)?data:[]; }
  }catch(e){ err=(e&&e.message)?e.message:String(e); }
  if(!perfisUsuario.some(p=>PERFIS_OK.includes(p))){ telaSemAcesso(err); return; }
  // obras às quais este gestor está restrito (vazio = todas). Admin sempre vê todas.
  G.obrasRestritas=[];
  try{
    if(!perfisUsuario.includes('admin')){
      const { data } = await sb.rpc('minhas_obras');
      G.obrasRestritas = Array.isArray(data) ? data.map(Number) : [];
    }
  }catch(_){ G.obrasRestritas=[]; }
  try{
    const { data, error } = await sb.from('obras').select('id,nome').order('nome');
    if(error) throw error;
    let lista = data||[];
    if(G.obrasRestritas.length){ lista = lista.filter(o=>G.obrasRestritas.includes(Number(o.id))); }
    OBRAS=lista;
    if(!OBRAS.length){ root.innerHTML=casca(); document.getElementById('wrap').innerHTML='<div class="estado">Nenhuma obra liberada para o seu acesso.</div>'; return; }
    G.obra=OBRAS[0].id;
    await carregarDados();
    render();
  }catch(e){ root.innerHTML=casca(); document.getElementById('wrap').innerHTML='<div class="erro"><b>Não consegui carregar.</b><br>'+(e.message||e)+'</div>'; }
}

async function carregarDados(){
  G.dados=null;
  await carregarCurvasMaturidade();
  const obraId=G.obra;
  G.obraNome=(OBRAS.find(o=>String(o.id)===String(obraId))||{}).nome||'';
  const { data:pavs, error:e0 } = await sb.from('pavimentos').select('id,nome,ordem').eq('obra_id',obraId).order('ordem');
  if(e0) throw e0;

  // Filtra a OBRA já na consulta (via relação), trazendo só o que é desta obra.
  const romps = await pegarTudo('rompimentos',
    'idade_real,data_rompimento,prensa1_tf,resultado_mpa,confirmado,corpos_prova!inner(numero,betoneiras!inner(nota_fiscal,fck,slump_especificado,tolerancia,traco_descricao,slump_medido,agua_adicionada,volume,observacao,concretagens!inner(obra_id,data_concretagem,elementos(nome),pavimentos!inner(id,nome),concreteiras(nome))))',
    q=>q.eq('corpos_prova.betoneiras.concretagens.obra_id', obraId));
  const cpsPend = await pegarTudo('corpos_prova',
    'numero,idade_prevista,data_prevista,descartado,betoneiras!inner(nota_fiscal,fck,volume,observacao,concretagens!inner(obra_id,data_concretagem,elementos(nome),pavimentos!inner(id,nome))),rompimentos(id)',
    q=>q.eq('betoneiras.concretagens.obra_id', obraId));
  const recus = await pegarTudo('betoneiras',
    'nota_fiscal,fck,slump_especificado,tolerancia,traco_descricao,volume,aceita,observacao,concretagens!inner(obra_id,data_concretagem,elementos(nome),pavimentos!inner(id,nome)),motivos_recusa(nome)',
    q=>q.eq('concretagens.obra_id', obraId).eq('aceita', false));
  // betoneiras ACEITAS — fonte do volume total (igual ao Orçamento)
  const aceitasBt = await pegarTudo('betoneiras',
    'nota_fiscal,fck,slump_especificado,tolerancia,traco_descricao,volume,aceita,observacao,concretagens!inner(obra_id,data_concretagem,elementos(nome),pavimentos!inner(id,nome))',
    q=>q.eq('concretagens.obra_id', obraId).eq('aceita', true));

  const R = (romps||[]).filter(r=>r.confirmado && r.corpos_prova&&r.corpos_prova.betoneiras&&r.corpos_prova.betoneiras.concretagens)
    .map(r=>{ const b=r.corpos_prova.betoneiras,c=b.concretagens,p=c.pavimentos;
      const mpa=r.resultado_mpa!=null?Number(r.resultado_mpa):(r.prensa1_tf!=null?r.prensa1_tf*MPA_PER_TF:null);
      return { pavId:p.id, pav:p.nome, elem:(c.elementos&&c.elementos.nome)||'', nf:b.nota_fiscal, fck:b.fck, concreteira:(c.concreteiras&&c.concreteiras.nome)||'', slump:b.slump_especificado, tol:b.tolerancia, desc:b.traco_descricao,
               slumpMed:b.slump_medido, agua:b.agua_adicionada, vol:Number(b.volume)||0, idade:r.idade_real, data:c.data_concretagem, dataRomp:r.data_rompimento, mpa, obs:b.observacao||'' }; });
  const nfComFinal=new Set(R.filter(r=>ehFinal(r.idade)).map(r=>r.nf));
  const semRomp = cp => !cp.rompimentos || (Array.isArray(cp.rompimentos)?cp.rompimentos.length===0:!cp.rompimentos);
  const P = (cpsPend||[]).filter(cp=>!cp.descartado && semRomp(cp) && cp.betoneiras&&cp.betoneiras.concretagens && cp.idade_prevista!=null && cp.idade_prevista<28)
    .map(cp=>{ const b=cp.betoneiras,c=b.concretagens,p=c.pavimentos;
      return { pavId:p.id, pav:p.nome, elem:(c.elementos&&c.elementos.nome)||'', nf:b.nota_fiscal, fck:b.fck, vol:Number(b.volume)||0, idade:cp.idade_prevista, data:c.data_concretagem, prev:cp.data_prevista, obs:b.observacao||'' }; })
    .filter(x=>!nfComFinal.has(x.nf));
  const X = (recus||[]).filter(b=>!b.aceita && b.concretagens)
    .map(b=>{ const c=b.concretagens,p=c.pavimentos;
      return { pavId:p.id, pav:p.nome, elem:(c.elementos&&c.elementos.nome)||'', nf:b.nota_fiscal, fck:b.fck, slump:b.slump_especificado, tol:b.tolerancia, desc:b.traco_descricao, vol:Number(b.volume)||0, data:c.data_concretagem, motivo:(b.motivos_recusa&&b.motivos_recusa.nome)||'—', obs:b.observacao||'' }; });

  const A = (aceitasBt||[]).filter(b=>b.concretagens)
    .map(b=>{ const c=b.concretagens,p=c.pavimentos;
      return { pavId:p.id, pav:p.nome, elem:(c.elementos&&c.elementos.nome)||'', nf:b.nota_fiscal, fck:b.fck, slump:b.slump_especificado, tol:b.tolerancia, desc:b.traco_descricao, vol:Number(b.volume)||0, data:c.data_concretagem, obs:b.observacao||'' }; });

  const datas=[...new Set([...R,...P,...X,...A].map(r=>r.data).filter(Boolean))].sort().reverse();
  G.dados={ pavs, R, P, X, A, datas };
  G.calRef = datas.length ? new Date(datas[0]+'T00:00:00') : new Date();
  if(datas.length){ G.rel.de = datas[datas.length-1]; G.rel.ate = datas[0]; }
  else { G.rel.de=''; G.rel.ate=''; }
  G.rel.traco=''; G.rel.pav=''; G.rel.idade='';
}
async function trocarObra(id){
  G.obra=id; G.fData=''; G.fPav=null;
  const wrap=document.getElementById('wrap'); if(wrap) wrap.innerHTML='<div class="estado">Carregando dados da obra…</div>';
  try{ await carregarDados(); render(); }
  catch(e){ const w=document.getElementById('wrap'); if(w) w.innerHTML='<div class="erro"><b>Não consegui carregar.</b><br>'+(e.message||e)+'</div>'; }
}
async function pegarTudo(tabela, cols, mod){
  let todos=[], de=0; const passo=1000;
  while(true){
    let q = sb.from(tabela).select(cols);
    if(mod) q = mod(q);
    q = q.range(de, de+passo-1);
    const { data, error } = await q;
    if(error) throw error; todos=todos.concat(data||[]); if(!data||data.length<passo) break; de+=passo;
  }
  return todos;
}

function duplasFinais(romps){
  const map={};
  romps.filter(r=>ehFinal(r.idade)).forEach(r=>{ const k=r.nf+'|'+r.idade;
    if(!map[k]) map[k]={ pavId:r.pavId,pav:r.pav,elem:r.elem,nf:r.nf,fck:r.fck,slump:r.slump,tol:r.tol,desc:r.desc,vol:r.vol,idade:r.idade,data:r.data,dataRomp:r.dataRomp,slumpMed:r.slumpMed,agua:r.agua,obs:r.obs||'',mpas:[] };
    map[k].mpas.push(r.mpa); });
  return Object.values(map).map(d=>{ const melhor=Math.max(...d.mpas.filter(v=>v!=null),-Infinity);
    return { ...d, resultado:isFinite(melhor)?melhor:null, conforme:isFinite(melhor)?melhor>=(d.fck||0):null }; });
}
function taxaColor(taxa){
  const p=Math.max(0,Math.min(taxa,0.30))/0.30;
  const stops=[[63,148,90],[240,196,70],[226,140,40],[176,42,32]];
  const x=p*(stops.length-1); const i=Math.min(Math.floor(x),stops.length-2); const t=x-i;
  const c=k=>Math.round(stops[i][k]+(stops[i+1][k]-stops[i][k])*t);
  return `rgb(${c(0)},${c(1)},${c(2)})`;
}
function labelTraco(d){
  const has=v=>v!==null&&v!==undefined&&String(v).trim()!=='';
  let s=`fck ${has(d.fck)?d.fck:'—'}`;
  if(has(d.slump)) s+=` · ${d.slump}±${has(d.tol)?d.tol:'?'}`;
  if(has(d.desc)) s+=` · ${d.desc}`;
  return s;
}
function dadosFiltrados(){
  const D=G.dados; let R=D.R,P=D.P,X=D.X;
  if(G.fData){ R=R.filter(r=>r.data===G.fData); P=P.filter(p=>p.data===G.fData); X=X.filter(x=>x.data===G.fData); }
  return {R,P,X};
}

  const {R,P,X}=dadosFiltrados();
  const finais=duplasFinais(R);
  // parciais: rompidos de idade <28 (com MPa) + pendentes (sem resultado)
  const parcRompidos=(() => {
    const map={};
    R.filter(r=>r.idade!=null && r.idade<28).forEach(r=>{ const k=r.nf+'|'+r.idade;
      if(!map[k]) map[k]={ pavId:r.pavId,pav:r.pav,elem:r.elem,nf:r.nf,fck:r.fck,concreteira:r.concreteira,slump:r.slump,tol:r.tol,desc:r.desc,vol:r.vol,idade:r.idade,data:r.data,obs:r.obs||'',mpas:[] };
      map[k].mpas.push(r.mpa); });
    return Object.values(map).map(d=>{ const m=Math.max(...d.mpas.filter(v=>v!=null),-Infinity);
      return { ...d, resultado:isFinite(m)?m:null, rompido:true }; });
  })();
  const parcPendentes=P.map(p=>({ ...p, resultado:null, rompido:false }));
  const parciais=parcRompidos.concat(parcPendentes)
    .sort((a,b)=> (a.data<b.data?1:a.data>b.data?-1: (a.idade-b.idade) || String(a.nf).localeCompare(String(b.nf),undefined,{numeric:true})));

  finais.forEach(d=>{ const a=pavAndar[d.pavId]; if(a&&andarMap[a]){ d.conforme?andarMap[a].ok++:andarMap[a].nc++; } });

    return `<button class="pv ${cls} ${sel}" ${style} title="${tip}" onclick="filtrarAndar('${a.replace(/'/g,"\\'")}')">${a}</button>`;
  }).join('');

  let detF=finais,detP=parciais,detX=X;

  // volume total (NF distinta) conforme os filtros atuais — de TODAS as betoneiras aceitas (igual Orçamento)

  const volMap={};

  const volTotal=Object.values(volMap).reduce((s,v)=>s+v,0);

  const rowF=d=>`<tr><td>${d.pav}</td><td style="font-size:12px">${d.elem||'—'}</td><td class="mono">${d.nf}</td><td class="mono">${fmt(d.vol)}</td><td style="font-size:11.5px;max-width:170px;word-break:break-word">${labelTraco(d)}</td><td class="mono">${d.idade}d</td><td class="mono">${fmt(d.resultado)} MPa</td><td style="font-size:12px">${d.obs||'—'}</td><td style="white-space:nowrap">${d.conforme?'<span class="chip ok">conforme</span>':'<span class="chip bad">não conf.</span>'}</td></tr>`;
  const rowP=c=>`<tr><td>${c.pav}</td><td style="font-size:12px">${c.elem||'—'}</td><td class="mono">${c.nf}</td><td class="mono">${fmt(c.vol)}</td><td>${labelTraco(c)}</td><td class="mono">${c.idade}d</td><td class="mono">${c.rompido&&c.resultado!=null?fmt(c.resultado)+' MPa':'—'}</td><td style="font-size:12px">${c.obs||'—'}</td><td>${c.rompido?(c.resultado!=null?semaforoChipParcial(c.resultado,c.idade,c.fck,c.concreteira,c.pav):'<span class="chip info">parcial</span>'):'<span class="chip warn">aguardando</span>'}</td></tr>`;
  const rowX=x=>`<tr><td>${x.pav}</td><td style="font-size:12px">${x.elem||'—'}</td><td class="mono">${x.nf}</td><td class="mono">${fmt(x.vol)}</td><td>${labelTraco(x)}</td><td class="mono">${fmtData(x.data)}</td><td>${x.motivo}</td><td style="font-size:12px">${x.obs||'—'}</td></tr>`;
  const volF=(arr,cols)=>{ const m={}; arr.forEach(r=>{ if(!(r.nf in m)) m[r.nf]=r.vol||0; }); const tot=Object.values(m).reduce((s,v)=>s+v,0); const nfs=Object.keys(m).length; return `<tr class="sumrow"><td colspan="${cols}">Volume total <b>${fmt(tot)} m³</b> · ${nfs} NF · ${arr.length} registro(s)</td></tr>`; };

  const obrasOpts=OBRAS.map(o=>`<option value="${o.id}" ${String(o.id)===String(G.obra)?'selected':''}>${o.nome}</option>`).join('');

  wrap.innerHTML=`

    </div>

      <div class="kpi"><div class="v">${pct}%</div><div class="k">Conformidade (final)</div></div>

          <tbody>${detP.length?detP.map(rowP).join('')+volF(detP,9):'<tr><td colspan="9" class="empty">Sem parciais.</td></tr>'}</tbody></table></div></div>
        <div class="card"><div class="ch">Betoneiras recusadas <span class="chip bad">${detX.length}</span>${G.fPav?` · ${G.fPav}`:''}</div>
          <div class="tscroll"><table><thead><tr><th>Pavimento</th><th>Elemento</th><th>NF</th><th>Vol <span class="lc">(m³)</span></th><th>Traço</th><th>Data</th><th>Motivo</th><th>Observação</th></tr></thead>
          <tbody>${detX.length?detX.map(rowX).join('')+volF(detX,8):'<tr><td colspan="8" class="empty">Nenhuma recusa.</td></tr>'}</tbody></table></div></div>
      </div>
    </div>`;
}

const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function calendarioHTML(){
  const ref = G.calRef || new Date();
  const ano=ref.getFullYear(), mes=ref.getMonth();
  const diasConc=new Set(G.dados.datas);

  const totalDias=new Date(ano,mes+1,0).getDate();
  const cells=[];
  for(let i=0;i<primeiroDia;i++) cells.push('');

    if(d==='') return '<div class="cal-cell empty"></div>';

    const has=diasConc.has(iso); const sel=G.fData===iso?'sel':'';

    return `<div class="cal-cell">${d}</div>`;
  }).join('');
  return `<div class="card cal">
    <div class="cal-nav"><button onclick="mudarMes(-1)">‹</button>
      <div style="font-weight:700">${MESES[mes]} / ${ano}</div>

}

// aplica filtros do relatório (período por data de concretagem, traço, pav, idade)
function passaFiltroRel(r, comIdade){
  if(G.rel.de && r.data < G.rel.de) return false;
  if(G.rel.ate && r.data > G.rel.ate) return false;
  if(G.rel.traco && labelTraco(r)!==G.rel.traco) return false;
  if(G.rel.pav && r.pav!==G.rel.pav) return false;
  if(comIdade && G.rel.idade && String(r.idade)!==String(G.rel.idade)) return false;
  return true;
}
function relResultados(){
  return duplasFinais(G.dados.R).filter(d=>passaFiltroRel(d,true))
    .sort((a,b)=> a.data<b.data?1:a.data>b.data?-1:String(a.nf).localeCompare(String(b.nf),undefined,{numeric:true}));
}
function relQuantidades(){
  // betoneiras ACEITAS (uma por NF, da fonte de betoneiras) + recusadas — igual ao Orçamento
  const map={};
  (G.dados.A||[]).filter(r=>passaFiltroRel(r,false)).forEach(r=>{ if(!map[r.nf]) map[r.nf]={pav:r.pav,elem:r.elem,data:r.data,nf:r.nf,traco:labelTraco(r),vol:r.vol,aceite:'Aceita',motivo:'',obs:r.obs||''}; });
  const aceitas=Object.values(map);
  const recus=G.dados.X.filter(x=>passaFiltroRel(x,false)).map(x=>({pav:x.pav,elem:x.elem,data:x.data,nf:x.nf,traco:labelTraco(x),vol:x.vol,aceite:'Recusada',motivo:x.motivo,obs:x.obs||''}));
  return aceitas.concat(recus).sort((a,b)=> a.data<b.data?1:a.data>b.data?-1:String(a.nf).localeCompare(String(b.nf),undefined,{numeric:true}));
}

// soma de volume por traço completo
function somaPorTraco(arr){
  const map={};
  arr.forEach(r=>{ if(!map[r.traco]) map[r.traco]={traco:r.traco,vol:0}; map[r.traco].vol+=(r.vol||0); });
  return Object.values(map).sort((a,b)=>a.traco.localeCompare(b.traco));
}
function exportarRelExcel(tipo){

// lista de curvas para o gráfico, montada a partir de CURVAS_MAT (banco)
function cmListaCurvas(){
  const cores={'40|Concrebrás|INFRA':'#3F945A','40|Concrebrás|SUPRA':'#BD5D27','40|Max Mohr|SUPRA':'#2f6fb0','50|Max Mohr|SUPRA':'#7a4bbd','50|Concrebrás|SUPRA':'#5a5a5a'};
  const nomes={'40|Concrebrás|INFRA':'fck 40 · Concrebrás · Infra','40|Concrebrás|SUPRA':'fck 40 · Concrebrás · Supra','40|Max Mohr|SUPRA':'fck 40 · Max Mohr · Supra','50|Max Mohr|SUPRA':'fck 50 · Max Mohr · Supra','50|Concrebrás|SUPRA':'fck 50 · Concrebrás · Supra'};
  const ordem=['40|Concrebrás|INFRA','40|Concrebrás|SUPRA','40|Max Mohr|SUPRA','50|Max Mohr|SUPRA','50|Concrebrás|SUPRA'];
  const lista=[];
  ordem.forEach(k=>{ if(CURVAS_MAT&&CURVAS_MAT[k]) lista.push({chave:k, nome:nomes[k]||k, cor:cores[k]||'#888', fck:parseInt(k)}); });
  // inclui eventuais curvas extras não previstas na ordem
  if(CURVAS_MAT) Object.keys(CURVAS_MAT).forEach(k=>{ if(!ordem.includes(k)) lista.push({chave:k, nome:k.replace(/\|/g,' · '), cor:'#888', fck:parseInt(k)}); });
  return lista;
}
function fCurva(t,c){ return c.f28*Math.exp(c.s*(1-Math.sqrt(28/t))); }
let CM_visiveis=[];

function desenharCurvas(){
  const wrap=document.getElementById('wrap');
  const lista=cmListaCurvas();
  const sumLinks=CM_TOPICOS.map((t,i)=>`<a id="cmlnk_${t.id}" class="${i===0?'on':''}" onclick="cmScroll('${t.id}')">${i+1}. ${t.nome}</a>`).join('');
  const eqRows=lista.map(c=>{const cv=CURVAS_MAT[c.chave];
    return `<tr><td>${c.nome}</td><td class="mono">${cv.s.toFixed(3)}</td><td class="mono">${cv.f28.toFixed(1)}</td><td class="mono">${cv.r2!=null?cv.r2.toFixed(2):'—'}</td><td class="cm-eqf">f(t)=${cv.f28.toFixed(1)}·exp{${cv.s.toFixed(3)}·[1−√(28/t)]}</td></tr>`;
  }).join('');
  const botoes=lista.map((c,i)=>`<button class="on" data-cmi="${i}" onclick="cmToggle(${i})"><span class="cm-dot" style="background:${c.cor}"></span>${c.nome}</button>`).join('');
  wrap.innerHTML=`<div class="cm-layout">
    <nav class="cm-sum"><h4>Sumário</h4>${sumLinks}</nav>
    <div class="cm-cont" id="cmCont">
      <section id="cm1"><h2>Curvas de maturidade do concreto</h2>
        <p>As curvas de maturidade descrevem a evolução da resistência à compressão do concreto em função da idade. O ganho de resistência é acentuado nas primeiras idades e desacelera progressivamente à medida que a hidratação do cimento avança, tendendo à estabilização em torno dos 28 dias, idade de referência para o fck.</p>
        <p>A partir da curva calibrada de cada concreto, um rompimento em idade jovem (3, 5 ou 7 dias) permite projetar a resistência esperada aos 28 dias e avaliar, com antecedência, se o material tende a atingir o fck especificado. Desvios do comportamento previsto podem ser identificados precocemente, viabilizando ações corretivas ou a guarda de corpos de prova para contraprova.</p>
        <div class="cm-destaque">Esta é a base do <b>semáforo</b> do laboratório e do dashboard: a curva funciona como referência para classificar cada resultado em idade jovem quanto à sua trajetória em direção ao fck.</div>
      </section>
      <section id="cm2"><h2>A norma e a fórmula</h2>
        <p>A modelagem segue a <b>ABNT NBR 6118</b>, que trata da evolução da resistência do concreto com a idade. A norma estabelece que, havendo ensaios do próprio concreto, esses dados devem ser utilizados para a determinação da curva, adotando a formulação do CEB-FIP:</p>
        <div class="cm-formula">f(t) = f<sub>28</sub> · exp{ s · [ 1 − √(28 / t) ] }</div>
        <p>Onde <b>t</b> é a idade em dias, <b>f<sub>28</sub></b> é a resistência aos 28 dias e <b>s</b> é o coeficiente que representa a cinética de endurecimento do cimento. Cada concreto possui seu próprio <b>s</b> e <b>f<sub>28</sub></b>, calibrados a partir dos resultados reais de ensaio.</p>
      </section>
      <section id="cm3"><h2>De onde vêm os dados</h2>
        <p>As curvas são construídas a partir do histórico de rompimentos do Controle Tecnológico. Alguns critérios orientam a formação da amostra:</p>
        <p>• <b>Maior da dupla:</b> cada exemplar possui dois corpos de prova por idade; adota-se o maior resultado, conforme a prática da norma.<br>
        • <b>Infra e supraestrutura separadas:</b> elementos de fundação e de elevação apresentam comportamentos distintos, recebendo curvas próprias.<br>
        • <b>Por fck e concreteira:</b> cada combinação de resistência e fornecedor gera uma curva específica.</p>
      </section>
      <section id="cm4"><h2>Como lemos os resultados</h2>
        <p>Antes da construção de cada curva, os dados passam por um tratamento criterioso: removem-se apenas resultados comprovadamente inconsistentes (valores fisicamente impossíveis ou erros de registro), preservando a variação natural do concreto.</p>
        <p>A curva é <b>ancorada nas idades de 7 e 28 dias</b>, as de maior massa de dados e, portanto, maior confiabilidade estatística. Com isso, a curva passa exatamente pela média real dessas duas idades. O coeficiente resulta de forma fechada:</p>
        <div class="cm-formula">s = − ln ( f<sub>7,méd</sub> / f<sub>28,méd</sub> )</div>
      </section>
      <section id="cm5"><h2>As equações</h2>
        <p>Cada uma das curvas calibradas, com seu coeficiente <b>s</b>, a resistência de referência aos 28 dias (<b>f<sub>28</sub></b>) e o R² (medida de quão bem a curva representa os dados):</p>
        <table class="cm-eqt"><thead><tr><th>Concreto</th><th>s</th><th>f28</th><th>R²</th><th>Equação</th></tr></thead><tbody>${eqRows||'<tr><td colspan="5">Nenhuma curva cadastrada.</td></tr>'}</tbody></table>
      </section>
      <section id="cm6"><h2>Os gráficos</h2>
        <p>Passe o cursor sobre o gráfico para visualizar a resistência estimada em cada idade. Utilize os botões para exibir ou ocultar cada concreto.</p>
        <div class="cm-gc">${botoes}</div>
        <div class="cm-gwrap"><svg id="cmGraf" style="width:100%;height:auto;display:block" viewBox="0 0 720 420" preserveAspectRatio="xMidYMid meet"></svg></div>
      </section>
      <section id="cm7"><h2>Como usar no dia a dia</h2>
        <p>Ao romper um corpo de prova em idade jovem, o sistema projeta o resultado para os 28 dias utilizando a curva do concreto e compara com o fck. O <b>semáforo</b> apresenta:</p>
        <div class="cm-destaque"><b>Seguindo o esperado:</b> projeção ≥ 115% do fck. Comportamento saudável.</div>
        <div class="cm-aviso"><b>Atenção: comportamento no limite do esperado:</b> projeção entre 100% e 115% do fck. Recomenda-se guardar corpos de prova para contraprova aos 63 dias.</div>
        <div class="cm-risco"><b>Risco identificado: comportamento abaixo do esperado:</b> projeção abaixo de 100% do fck. Guarde corpos de prova para contraprova aos 63 dias.</div>
        <p style="font-size:13px;color:var(--muted)">O semáforo constitui apoio à decisão. O ensaio de conformidade aos 28 e 63 dias permanece sendo sempre realizado.</p>
      </section>
    </div></div>`;
  CM_visiveis=lista.map(()=>true);
  cmDesenhaGrafico();
  // scroll-spy
  const cont=document.getElementById('cmCont');
  if(cont){
    cont.closest('#wrap');
    const secs=CM_TOPICOS.map(t=>document.getElementById(t.id));
    const onScroll=()=>{ let atual=CM_TOPICOS[0].id; secs.forEach(s=>{ if(s&&s.getBoundingClientRect().top<180) atual=s.id; });
      CM_TOPICOS.forEach(t=>{ const l=document.getElementById('cmlnk_'+t.id); if(l) l.classList.toggle('on',t.id===atual); }); };
    window.addEventListener('scroll', onScroll, {passive:true});
  }
}

function cmDesenhaGrafico(){
  const svg=document.getElementById('cmGraf'); if(!svg) return;
  const lista=cmListaCurvas();
  const W=720,H=420,mL=48,mR=16,mT=16,mB=40;
  const x0=mL,x1=W-mR,y0=H-mB,y1=mT;
  const tMax=70,yMin=0,yMax=75;
  const X=t=>x0+(t/tMax)*(x1-x0);
  const Y=v=>y0-((v-yMin)/(yMax-yMin))*(y0-y1);
  let s='';
  s+=`<defs><clipPath id="cmClip"><rect x="${x0}" y="${y1}" width="${x1-x0}" height="${y0-y1}"/></clipPath></defs>`;
  for(let t=0;t<=70;t+=7){ s+=`<line x1="${X(t)}" y1="${y0}" x2="${X(t)}" y2="${y1}" stroke="#EAE2C6" stroke-width="1"/>`;
    s+=`<text x="${X(t)}" y="${y0+16}" font-size="10" fill="#7A746A" text-anchor="middle" font-family="JetBrains Mono">${t}</text>`; }
  for(let v=yMin;v<=yMax;v+=15){ s+=`<line x1="${x0}" y1="${Y(v)}" x2="${x1}" y2="${Y(v)}" stroke="#EAE2C6" stroke-width="1"/>`;
    s+=`<text x="${x0-6}" y="${Y(v)+3}" font-size="10" fill="#7A746A" text-anchor="end" font-family="JetBrains Mono">${v}</text>`; }
  s+=`<text x="${(x0+x1)/2}" y="${H-4}" font-size="11" fill="#2b2b2b" text-anchor="middle">Idade (dias)</text>`;
  s+=`<text x="14" y="${(y0+y1)/2}" font-size="11" fill="#2b2b2b" text-anchor="middle" transform="rotate(-90 14 ${(y0+y1)/2})">Resistência (MPa)</text>`;
  lista.forEach((c,i)=>{ if(!CM_visiveis[i])return; const cv=CURVAS_MAT[c.chave]; let d='';
    for(let t=1;t<=tMax;t+=0.5){ const yy=fCurva(t,cv); d+=(t===1?'M':'L')+X(t)+' '+Y(yy)+' '; }
    s+=`<path d="${d}" fill="none" stroke="${c.cor}" stroke-width="2.4" clip-path="url(#cmClip)"/>`;
    [7,28].forEach(t=>{ const yy=fCurva(t,cv); s+=`<circle cx="${X(t)}" cy="${Y(yy)}" r="3.5" fill="#fff" stroke="${c.cor}" stroke-width="2"/>`; });
  });
  s+=`<rect id="cmHoverArea" x="${x0}" y="${y1}" width="${x1-x0}" height="${y0-y1}" fill="transparent"/>`;
  s+=`<line id="cmHoverLine" x1="0" y1="${y1}" x2="0" y2="${y0}" stroke="#8E4319" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>`;
  s+=`<g id="cmHoverPts"></g>`;
  svg.innerHTML=s;
  const area=svg.querySelector('#cmHoverArea'), line=svg.querySelector('#cmHoverLine'), pts=svg.querySelector('#cmHoverPts');
  const tip=document.getElementById('cmTip')||(()=>{const d=document.createElement('div');d.id='cmTip';d.style.cssText='position:fixed;pointer-events:none;background:#2b2b2b;color:#fff;font-size:11.5px;padding:7px 9px;border-radius:8px;display:none;z-index:99;line-height:1.5;font-family:Montserrat';document.body.appendChild(d);return d;})();
  area.addEventListener('mousemove', ev=>{
    const rect=svg.getBoundingClientRect(); const scale=W/rect.width; const px=(ev.clientX-rect.left)*scale;
    let t=Math.max(1,Math.min(tMax, ((px-x0)/(x1-x0))*tMax)); t=Math.round(t);
    line.setAttribute('x1',X(t)); line.setAttribute('x2',X(t)); line.style.display='';
    let ph=''; let linhas=`<b>${t} dias</b>`;
    lista.forEach((c,i)=>{ if(!CM_visiveis[i])return; const cv=CURVAS_MAT[c.chave]; const yy=fCurva(t,cv);
      ph+=`<circle cx="${X(t)}" cy="${Y(yy)}" r="4" fill="${c.cor}" stroke="#fff" stroke-width="1.5"/>`;
      linhas+=`<br><span style="color:${c.cor}">●</span> ${c.nome}: <b>${yy.toFixed(1)} MPa</b>`; });
    pts.innerHTML=ph; tip.innerHTML=linhas; tip.style.display=''; tip.style.left=(ev.clientX+14)+'px'; tip.style.top=(ev.clientY+10)+'px';
  });
  area.addEventListener('mouseleave', ()=>{ line.style.display='none'; pts.innerHTML=''; const t=document.getElementById('cmTip'); if(t)t.style.display='none'; });
}

(async function(){
  const { data } = await sb.auth.getSession();
  if(data.session){ userEmail=data.session.user.email; iniciar(); }
  else telaLogin('');
})();
</script>
